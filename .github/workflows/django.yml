name: Django CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: su_lms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d su_lms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/su_lms_test
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install coverage==7.10.4
      - name: Run Django system checks
        run: python manage.py check
      - name: Check project migrations
        run: >-
          python manage.py makemigrations
          accounts core attendance result finance
          organization courses enrollments learning progress audit calendar_events
          --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file schema.yml --validate
      - name: Run tests with Release 1 coverage
        run: |
          python -m coverage run manage.py test
          python -m coverage report
