name: Pylint

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylint==3.3.7
      - name: Analyze Release 1 code
        run: |
          python -m pylint \
            api \
            accounts/api/v1 \
            accounts/authentication.py \
            audit \
            config/database.py \
            courses \
            enrollments \
            learning \
            organization \
            progress \
            scripts
